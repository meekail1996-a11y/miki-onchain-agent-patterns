name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside && /^\[[^]]+\]: / { exit }
              inside { print }
            ' CHANGELOG.md > "$notes"
          fi

          if [ ! -s "$notes" ]; then
            echo "No CHANGELOG.md section for $VERSION; using a fallback note." >&2
            printf 'See CHANGELOG.md for details.\n' > "$notes"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --verify-tag
