name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found; cannot build release notes." >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside && substr($0, 1, 1) == "[" && index($0, "]:") > 0 { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION (expected a heading like '## [$VERSION] - YYYY-MM-DD'). Refusing to publish a release without notes." >&2
            exit 1
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --verify-tag
